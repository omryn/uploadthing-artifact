name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    name: Build

    strategy:
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.runs-on }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile
      run: npm run build

    - name: Lint
      run: npm run lint

    - name: Format
      run: npm run format-check

    - name: Test
      run: npm run test

  uploadthing-e2e:
    name: UploadThing E2E
    needs: build
    runs-on: ubuntu-latest
    env:
      UPLOADTHING_TOKEN: ${{ secrets.APTApiKey }}

    steps:
    - name: Skip without UploadThing token
      if: ${{ env.UPLOADTHING_TOKEN == '' }}
      run: echo 'Skipping UploadThing E2E because APTApiKey is not configured.'

    - name: Checkout
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      uses: actions/checkout@v4

    - name: Setup Node 24
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Install dependencies
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: npm ci

    - name: Compile
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: npm run build

    - name: Create artifact files
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: |
        mkdir -p path/to/dir-1 path/to/dir-2 direct merge-a merge-b
        echo 'Lorem ipsum dolor sit amet' > path/to/dir-1/file1.txt
        echo 'Hello world from file #2' > path/to/dir-2/file2.txt
        echo 'direct file upload content' > direct/report.txt
        echo 'merge a' > merge-a/file-a.txt
        echo 'merge b' > merge-b/file-b.txt

    - name: Upload zipped artifact
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      id: zipped
      uses: ./
      with:
        name: e2e-zipped-${{ github.run_id }}
        path: path/**/dir*

    - name: Upload direct artifact
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      id: direct
      uses: ./
      with:
        path: direct/report.txt
        archive: false

    - name: Download and verify zipped artifact
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: |
        mkdir -p downloaded-zipped
        curl -fsSL '${{ steps.zipped.outputs.artifact-url }}' -o artifact.zip
        unzip -q artifact.zip -d downloaded-zipped
        test "$(cat downloaded-zipped/to/dir-1/file1.txt)" = 'Lorem ipsum dolor sit amet'
        test "$(cat downloaded-zipped/to/dir-2/file2.txt)" = 'Hello world from file #2'

    - name: Download and verify direct artifact
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: |
        curl -fsSL '${{ steps.direct.outputs.artifact-url }}' -o report.txt
        test "$(cat report.txt)" = 'direct file upload content'

    - name: Upload merge source A
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      id: merge-a
      uses: ./
      with:
        name: merge-source-a-${{ github.run_id }}
        path: merge-a/file-a.txt

    - name: Upload merge source B
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      id: merge-b
      uses: ./
      with:
        name: merge-source-b-${{ github.run_id }}
        path: merge-b/file-b.txt

    - name: Merge artifacts
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      id: merge
      uses: ./merge/
      with:
        name: merged-${{ github.run_id }}
        pattern: merge-source-*
        separate-directories: true

    - name: Download and verify merged artifact
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: |
        mkdir -p downloaded-merged
        curl -fsSL '${{ steps.merge.outputs.artifact-url }}' -o merged.zip
        unzip -q merged.zip -d downloaded-merged
        test "$(cat downloaded-merged/merge-source-a-${{ github.run_id }}/file-a.txt)" = 'merge a'
        test "$(cat downloaded-merged/merge-source-b-${{ github.run_id }}/file-b.txt)" = 'merge b'

    - name: Delete UploadThing E2E artifacts
      if: ${{ always() && env.UPLOADTHING_TOKEN != '' }}
      env:
        CUSTOM_IDS: |
          ${{ steps.zipped.outputs.artifact-custom-id }}
          ${{ steps.direct.outputs.artifact-custom-id }}
          ${{ steps.merge-a.outputs.artifact-custom-id }}
          ${{ steps.merge-b.outputs.artifact-custom-id }}
          ${{ steps.merge.outputs.artifact-custom-id }}
      run: |
        node --input-type=module <<'EOF'
        import {UTApi} from 'uploadthing/server'
        const ids = process.env.CUSTOM_IDS.split('\n').map(id => id.trim()).filter(Boolean)
        if (ids.length > 0) {
          await new UTApi().deleteFiles(ids, {keyType: 'customId'})
        }
        EOF
