name: Test Proxy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  test-proxy-upload:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
      options: --cap-add=NET_ADMIN
    services:
      squid-proxy:
        image: ubuntu/squid:latest
        ports:
          - 3128:3128
    env:
      http_proxy: http://squid-proxy:3128
      https_proxy: http://squid-proxy:3128
      UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
    steps:
    - name: Skip without UploadThing token
      if: ${{ env.UPLOADTHING_TOKEN == '' }}
      run: echo 'Skipping proxy upload test because UPLOADTHING_TOKEN is not configured.'

    - name: Wait for proxy to be ready
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      shell: bash
      run: |
        echo 'Waiting for squid proxy to be ready...'
        getent hosts squid-proxy || echo 'DNS resolution failed'
        for i in $(seq 1 30); do
          if (echo > /dev/tcp/squid-proxy/3128) 2>/dev/null; then
            echo 'Proxy is ready!'
            exit 0
          fi
          echo "Attempt $i: Proxy not ready, waiting..."
          sleep 2
        done
        echo 'Proxy failed to become ready'
        exit 1
      env:
        http_proxy: ''
        https_proxy: ''

    - name: Install system dependencies
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: |
        apt-get update
        apt-get install -y iptables curl nodejs npm git

    - name: Verify proxy is working
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: |
        curl -s -o /dev/null -w '%{http_code}' --proxy http://squid-proxy:3128 https://api.uploadthing.com || true
        echo 'Proxy verification complete'

    - name: Block direct traffic
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: |
        PROXY_IP=$(getent hosts squid-proxy | awk '{ print $1 }')
        echo "Proxy IP: $PROXY_IP"
        iptables -A OUTPUT -o lo -j ACCEPT
        iptables -A OUTPUT -d "$PROXY_IP" -j ACCEPT
        iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
        iptables -A OUTPUT -p udp --dport 53 -j ACCEPT
        iptables -A OUTPUT -p tcp --dport 53 -j ACCEPT
        iptables -A OUTPUT -p tcp --dport 80 -j REJECT
        iptables -A OUTPUT -p tcp --dport 443 -j REJECT
        iptables -L -v -n

    - name: Verify direct HTTPS is blocked
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: |
        if curl --noproxy '*' -s --connect-timeout 5 https://api.uploadthing.com > /dev/null 2>&1; then
          echo 'ERROR: Direct HTTPS request succeeded - blocking is not working!'
          exit 1
        fi
        curl --proxy http://squid-proxy:3128 -s --connect-timeout 10 https://api.uploadthing.com > /dev/null

    - name: Checkout
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      uses: actions/checkout@v4

    - name: Setup Node 24
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Install dependencies
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: npm ci

    - name: Build action
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: npm run build

    - name: Create artifact file
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      run: |
        mkdir -p test-artifacts
        echo "Proxy test artifact - $GITHUB_RUN_ID" > test-artifacts/proxy-test.txt

    - name: Upload artifact through proxy
      if: ${{ env.UPLOADTHING_TOKEN != '' }}
      id: upload
      uses: ./
      with:
        name: proxy-test-${{ github.run_id }}
        path: test-artifacts/proxy-test.txt

    - name: Delete proxy test artifact
      if: ${{ always() && env.UPLOADTHING_TOKEN != '' && steps.upload.outputs.artifact-custom-id != '' }}
      run: |
        node --input-type=module <<'EOF'
        import {UTApi} from 'uploadthing/server'
        await new UTApi().deleteFiles(process.env.CUSTOM_ID, {keyType: 'customId'})
        EOF
      env:
        CUSTOM_ID: ${{ steps.upload.outputs.artifact-custom-id }}
