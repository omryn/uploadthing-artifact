name: 'Merge Build Artifacts'
description: 'Merge one or more build Artifacts'
author: 'GitHub'
inputs:
  name:
    description: 'The name of the artifact that the artifacts will be merged into.'
    required: true
    default: 'merged-artifacts'
  pattern:
    description: 'A glob pattern matching the artifact names that should be merged.'
    default: '*'
  separate-directories:
    description: 'When multiple artifacts are matched, this changes the behavior of how they are merged in the archive.
      If true, the matched artifacts will be extracted into individual named directories within the specified path.
      If false, the matched artifacts will combined in the same directory.'
    default: 'false'
  retention-days:
    description: >
      Unsupported by UploadThing. Parsed for compatibility, but ignored with a warning.
  compression-level:
    description: >
      The level of compression for Zlib to be applied to the artifact archive.
      The value can range from 0 to 9:
      - 0: No compression
      - 1: Best speed
      - 6: Default compression (same as GNU Gzip)
      - 9: Best compression
      Higher levels will result in better compression, but will take longer to complete.
      For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
    default: '6'
  delete-merged:
    description: >
      If true, the artifacts that were merged will be deleted.
      If false, the artifacts will still exist.
    default: 'false'
  include-hidden-files:
    description: >
      If true, hidden files will be included in the merged artifact.
      If false, hidden files will be excluded from the merged artifact.
    default: 'false'
  uploadthing-token:
    description: 'UploadThing token. Defaults to the UPLOADTHING_TOKEN environment variable.'
  acl:
    description: 'UploadThing ACL for uploaded artifacts. Valid values are public-read and private.'
  content-disposition:
    description: 'Content-Disposition for uploaded artifacts. Valid values are inline and attachment.'
  signed-url-expires-in:
    description: 'Expiration for private artifact signed URLs.'

outputs:
  artifact-id:
    description: >
      Alias of artifact-key for compatibility. Empty if the artifact upload failed.
  artifact-key:
    description: >
      UploadThing file key for the artifact that was just uploaded. Empty if the artifact upload failed.
  artifact-custom-id:
    description: >
      UploadThing custom ID for the artifact that was just uploaded. Empty if the artifact upload failed.
  artifact-url:
    description: >
      UploadThing URL for the artifact that was just uploaded. Private artifacts return a signed URL.
  artifact-digest:
    description: >
      SHA-256 digest for the artifact that was just uploaded. Empty if the artifact upload failed.
runs:
  using: 'node24'
  main: '../dist/merge/index.js'
